<div class="app-container">
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">📋 Sistema de Clientes</span>
    </div>
  </nav>

  <!-- Content -->
  <div class="container-fluid mt-4">
    <div class="nav nav-tabs" role="tablist">
      <button 
        class="nav-link active" 
        id="form-tab" 
        data-bs-toggle="tab" 
        data-bs-target="#form-content" 
        type="button" 
        role="tab" 
        aria-controls="form-content" 
        aria-selected="true">
        ➕ Nuevo Cliente
      </button>
      <button 
        class="nav-link" 
        id="list-tab" 
        data-bs-toggle="tab" 
        data-bs-target="#list-content" 
        type="button" 
        role="tab" 
        aria-controls="list-content" 
        aria-selected="false">
        👥 Lista de Clientes
      </button>
    </div>

    <!-- Tab content -->
    <div class="tab-content mt-3">
      <!-- Form tab -->
      <div 
        class="tab-pane fade show active" 
        id="form-content" 
        role="tabpanel" 
        aria-labelledby="form-tab">
        <app-customer-form></app-customer-form>
      </div>

      <!-- List tab -->
      <div 
        class="tab-pane fade" 
        id="list-content" 
        role="tabpanel" 
        aria-labelledby="list-tab">
        <app-customer-list></app-customer-list>
      </div>
    </div>
  </div>
</div>
