<div class="app-container">
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">📋 Sistema de Clientes</span>
    </div>
  </nav>

  <!-- Content -->
  <div class="container-fluid mt-4">
    <div class="nav nav-tabs" role="tablist">
      <button 
        class="nav-link" 
        [class.active]="activeTab === 'form'"
        (click)="goToFormTab()"
        type="button" 
        role="tab">
        ➕ Nuevo Cliente
      </button>
      <button 
        class="nav-link" 
        [class.active]="activeTab === 'list'"
        (click)="goToListTab()"
        type="button" 
        role="tab">
        👥 Lista de Clientes
      </button>
    </div>

    <!-- Tab content -->
    <div class="tab-content mt-3">
      <!-- Form tab -->
      <div 
        class="tab-pane fade" 
        [class.show]="activeTab === 'form'"
        [class.active]="activeTab === 'form'"
        role="tabpanel">
        <app-customer-form (goToList)="goToListTab()"></app-customer-form>
      </div>

      <!-- List tab -->
      <div 
        class="tab-pane fade" 
        [class.show]="activeTab === 'list'"
        [class.active]="activeTab === 'list'"
        role="tabpanel">
        <app-customer-list></app-customer-list>
      </div>
    </div>
  </div>
</div>
